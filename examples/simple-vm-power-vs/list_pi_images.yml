---
- name: List Power Virtual Server Cloud Images
  hosts: localhost
  collections:
   - ibm.cloudcollection
  vars_files:
    - vars.yml

  tasks:
    - ibm_pi_images_info:
        pi_cloud_instance_id: "{{ service.pi_cloud_instance_id }}"
        ibmcloud_api_key: "{{ service.ibmcloud_api_key }}"
        region: "{{ service.region }}"
        zone: "{{ service.zone }}"
      register: images_list

    - debug:
        var: images_list.resource.image_info |
             items2dict(key_name='name', value_name='id')
