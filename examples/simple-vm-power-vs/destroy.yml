---
- name: POWER VSI Creation Demo
  hosts: localhost
  collections:
   - ibm.cloudcollection
  vars_files:
    vars.yml
  tasks:
    - name: Check for existing Virtual Server Instance
      ibm_pi_instance_info:
        pi_instance_name: "{{ instance['name'] }}"
        pi_cloud_instance_id: "{{ service.pi_cloud_instance_id }}"
        ibmcloud_api_key: "{{ service.ibmcloud_api_key }}"
        region: "{{ service.region }}"
        zone: "{{ service.zone }}"
      failed_when:
        - pi_instance_existing_output.rc != 0
        - '"does not exist" not in pi_instance_existing_output.stderr'
      register: pi_instance_existing_output

    - name: Destroy POWER Virtual Server Instance
      ibm_pi_instance:
        state: absent
        id: "{{ pi_instance_existing_output.resource.id | default(omit) }}"
        pi_cloud_instance_id: "{{ service.pi_cloud_instance_id }}"
        ibmcloud_api_key: "{{ service.ibmcloud_api_key }}"
        region: "{{ service.region }}"
        zone: "{{ service.zone }}"
      register: pi_instance_create_output
      when: pi_instance_existing_output.rc == 0

    - name: Check for existing storage volume
      ibm_pi_volume_info:
        pi_volume_name: "{{ storage_volume.name }}"
        pi_cloud_instance_id: "{{ service.pi_cloud_instance_id }}"
        ibmcloud_api_key: "{{ service.ibmcloud_api_key }}"
        region: "{{ service.region }}"
        zone: "{{ service.zone }}"
      failed_when:
        - pi_volume_existing_output.rc != 0
        - '"does not exist" not in pi_instance_existing_output.stderr'
      register: pi_volume_existing_output

    - name: Destroy storage volume
      ibm_pi_volume:
        state: absent
        id: "{{ pi_volume_existing_output.resource.id }}"
        pi_volume_size: "{{ pi_volume_existing_output.resource.size }}"
        pi_cloud_instance_id: "{{ service.pi_cloud_instance_id }}"
        ibmcloud_api_key: "{{ service.ibmcloud_api_key }}"
        region: "{{ service.region }}"
        zone: "{{ service.zone }}"
      when: pi_volume_existing_output.rc == 0

