---
- name: POWER VSI Creation Demo
  hosts: localhost
  collections:
   - ibm.cloudcollection
  vars_files:
    vars.yml
  tasks:
    - name: Check for existing SSH Key
      ibm_pi_key_info:
        pi_key_name: "{{ ssh_key.name }}"
        pi_cloud_instance_id: "{{ service.pi_cloud_instance_id }}"
        ibmcloud_api_key: "{{ service.ibmcloud_api_key }}"
        region: "{{ service.region }}"
        zone: "{{ service.zone }}"

    - name: Retrieve image list
      ibm_pi_images_info:
        pi_cloud_instance_id: "{{ service.pi_cloud_instance_id }}"
        ibmcloud_api_key: "{{ service.ibmcloud_api_key }}"
        region: "{{ service.region }}"
        zone: "{{ service.zone }}"
      register: images_list

    - name: Set VM image name/id dictionary fact
      set_fact:
        image_dict: "{{ images_list.resource.image_info |
                        items2dict(key_name='name',
                        value_name='id') }}"

    - name: Check for existing network
      ibm_pi_network_info:
        pi_network_name: "{{ network.name }}"
        pi_cloud_instance_id: "{{ service.pi_cloud_instance_id }}"
        ibmcloud_api_key: "{{ service.ibmcloud_api_key }}"
        region: "{{ service.region }}"
        zone: "{{ service.zone }}"
      failed_when: network_result.rc != 0
      register: network_result

    - name: Create storage volume(s)
      ibm_pi_volume:
        state: available
        pi_volume_name: "{{ item.name }}"
        pi_volume_size: "{{ item.size }}"
        pi_volume_type: "{{ item.type }}"
        pi_volume_shareable: "{{ item.shareable }}"
        pi_cloud_instance_id: "{{ service.pi_cloud_instance_id }}"
        ibmcloud_api_key: "{{ service.ibmcloud_api_key }}"
        region: "{{ service.region }}"
        zone: "{{ service.zone }}"
      register: pi_volume_create_output
      loop: "{{ storage_volumes.create }}"

    - name: Check for existing storage volume(s)
      ibm_pi_volume_info:
        pi_volume_name: "{{ item.name }}"
        pi_cloud_instance_id: "{{ service.pi_cloud_instance_id }}"
        ibmcloud_api_key: "{{ service.ibmcloud_api_key }}"
        region: "{{ service.region }}"
        zone: "{{ service.zone }}"
      failed_when:
        - pi_volume_existing_output.rc != 0
        - '"could not be found" not in pi_volume_existing_output.stderr'
      register: pi_volume_existing_output
      loop: "{{ storage_volumes.attach }}"

    - name: Create combined list of created and existing volume IDs
      set_fact:
        pi_volume_ids: "{{ (pi_volume_create_output.results | json_query('[].resource.volume_id')) + (pi_volume_existing_output.results | json_query('[].resource.id')) }}"

    - name: Check for existing Virtual Server Instance
      ibm_pi_instance_info:
        pi_instance_name: "{{ instance.name }}"
        pi_cloud_instance_id: "{{ service.pi_cloud_instance_id }}"
        ibmcloud_api_key: "{{ service.ibmcloud_api_key }}"
        region: "{{ service.region }}"
        zone: "{{ service.zone }}"
      failed_when:
        - pi_instance_existing_output.rc != 0
        - '"does not exist" not in pi_instance_existing_output.stderr'
      register: pi_instance_existing_output

    - name: Save existing Power VSI fact
      set_fact:
        cacheable: False
        pi_instance: "{{ pi_instance_existing_output.resource }}"
      when: pi_instance_existing_output.rc == 0

    - name: Create a POWER Virtual Server Instance
      ibm_pi_instance:
        state: available
        pi_memory: "{{ instance.memory }}"
        pi_processors: "{{ instance.processors }}"
        pi_instance_name: "{{ instance.name }}"
        pi_proc_type: "{{ instance.proc_type }}"
        pi_image_id: "{{ image_dict[instance.image] }}"
        pi_volume_ids: "{{ pi_volume_ids }}"
        pi_network:
          - network_id: "{{ network_result.resource.id }}"
        pi_key_pair_name: "{{ ssh_key.name }}"
        pi_sys_type: "{{ instance.sys_type }}"
        pi_storage_type: "{{ storage_volumes.create[0].type }}"
        pi_replication_policy: none
        pi_replication_scheme: suffix
        pi_replicants: "1"
        pi_cloud_instance_id: "{{ service.pi_cloud_instance_id }}"
        ibmcloud_api_key: "{{ service.ibmcloud_api_key }}"
        region: "{{ service.region }}"
        zone: "{{ service.zone }}"
      register: pi_instance_create_output
      when: pi_instance_existing_output.rc != 0

    - name: Retrieve Virtual Server Instance
      ibm_pi_instance_info:
        pi_instance_name: "{{ instance.name }}"
        pi_cloud_instance_id: "{{ service.pi_cloud_instance_id }}"
        ibmcloud_api_key: "{{ service.ibmcloud_api_key }}"
        region: "{{ service.region }}"
        zone: "{{ service.zone }}"
      register: pi_instance_new_output
      when: pi_instance_create_output.resource is defined

    - name: Save new Power VSI fact
      set_fact:
        cacheable: False
        pi_instance: "{{ pi_instance_new_output.resource }}"
      when: pi_instance_new_output.resource is defined

    - name: Print VSI network addresses
      debug:
        var: pi_instance.addresses
