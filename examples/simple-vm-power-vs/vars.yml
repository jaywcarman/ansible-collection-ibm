---
service:
  pi_cloud_instance_id: <PowerVS Service GUID>
  ibmcloud_api_key: <IBM Cloue IAM API Key>  # Can use Ansible Vault to encypt: https://docs.ansible.com/ansible/latest/user_guide/vault.html
  region: mon
  zone: mon01
ssh_key:
  name: tmp_ansible
  public: ~/.ssh/id_rsa_tmp_ansible.pub
  private: ~/.ssh/id_rsa_tmp_ansible
instance:
  name: ansible-demo-power-vm
  sys_type: s922
  image: "7200-05-01"
  proc_type: shared
  processors: "0.25"
  memory: "2"
network:
  name: ansible-demo-network
storage_volumes:
  create:
    - type: &storage_type tier1  # Use an anchor to make all storage_types consistent
      name: ansible-demo-vol-1
      size: 10 # in GB
      shareable: false
    - type: *storage_type
      name: ansible-demo-vol-2
      size: 10 # in GB
      shareable: true
  attach:
    - name: ansible-demo-existing-shared-vol-1
    - name: ansible-demo-existing-shared-vol-2
