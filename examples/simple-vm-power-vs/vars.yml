---
pi_cloud_instance_id: powervs_service_guid
ibmcloud_api_key: secretkey  # Can use Ansible Vault to encypt: https://docs.ansible.com/ansible/latest/user_guide/vault.html
region: mon
zone: mon01
ssh_key_name: tmp_ansible
ssh_key_public: ~/.ssh/id_rsa_tmp_ansible.pub
ssh_key_private: ~/.ssh/id_rsa_tmp_ansible
network_name_prefix: ansible-demo-network
network_type: vlan         # vlan or pub-vlan
network_cidr: 10.0.0.0/24  # Only used for private (vlan) network
